# --- Memory va performance optimallashtirish ---
# --add-opens: kapt (Hilt/Room/Glide) reaches into jdk.compiler internals; required on JDK 17.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED
# kapt stub generation runs in the Kotlin compiler daemon (separate JVM); it does NOT
# inherit org.gradle.jvmargs, so the jdk.compiler add-exports/add-opens must be repeated here.
kotlin.daemon.jvmargs=-Xmx4g --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED
# kapt needs a compiler that matches the JDK it runs on. Kotlin 1.9.0's kapt calls
# TreeMaker.Import(JCTree, boolean), a signature JDK 21 changed, so it dies with
# NoSuchMethodError the moment Android Studio ships a JBR 21 — which it now does.
# The module is on Kotlin 1.9.24, where kapt supports JDK 21. Do NOT drop the compiler
# back to 1.9.0 without also pinning the build to JDK 17. Older kapt also cannot run on
# JDK 23's locked-down javac internals (IllegalAccessError on
# com.sun.tools.javac.main.JavaCompiler) even with the add-exports below, so build with
# JDK 17-21; Android Studio's bundled jbr-21 works.
#
# org.gradle.java.home is intentionally NOT set here: it is an absolute, machine-specific
# path and breaks every other machine (Windows path on macOS => "Java home supplied is
# invalid"). Set it per machine instead:
#   - Android Studio: Settings > Build > Build Tools > Gradle > Gradle JDK
#   - CLI: JAVA_HOME, or org.gradle.java.home in ~/.gradle/gradle.properties
# --- Parallel va daemon ishga tushirish ---
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
# --- AndroidX va R class optimallashtirish ---
android.useAndroidX=true
android.nonTransitiveRClass=true
# --- Kotlin kod stili ---
kotlin.code.style=official
android.buildFeatures.buildConfig=true
