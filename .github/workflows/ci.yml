name: CI

# The TV app had no CI at all — only a release workflow — so a broken string
# resource reached a device before anyone saw it.
#
# It then had half a CI: a string check and a debug assemble. `app/src/test`
# holds 218 unit tests across 36 files — the watch-party wire format, the
# CloudStream extension parsing, the AniList matching, the history sync — and
# not one of them was run by this pipeline. A green check on a pull request
# said the resources merged and the app compiled, which is a much smaller claim
# than anyone reading it took it to be. This now has the same shape as the
# phone app's ci.yml: a string check, a TEST GATE, and a compile.
#
# `push` is the default branch only, with `pull_request` alongside it, which is
# the pairing the phone app settled on: a branch with a pull request open is
# covered by `pull_request`, a push straight to the default branch by `push`,
# and nothing is covered twice.

on:
  push:
    branches: [master]
    paths-ignore: ['apple-tv/**']
  pull_request:
    paths-ignore: ['apple-tv/**']
  # release.yml runs the same gates before it builds; it skips the debug
  # assemble because it builds a release APK right after.
  workflow_call:
    inputs:
      skip_assemble:
        type: boolean
        default: false

# A new push to a branch makes the run already in flight worthless, and these
# jobs are not short — the Gradle ones were measured at five to six minutes.
# Without this, pushing three times in ten minutes queues three full builds and
# waits for all of them.
#
# github.workflow is the caller's name when release.yml calls this, so a push
# to master cannot cancel the tests a release is waiting on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strings:
    name: Translated strings
    runs-on: ubuntu-latest
    # Seconds in practice; this is the hang budget, not the expected cost.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A mismatched format specifier throws at getString time, on that locale
      # only, on the screen that uses it. Nothing else in the build sees it.
      - name: Check the string resources
        run: python3 tools/check_strings.py

  # The gate the phone app has and this repo did not. Its own job, not a step
  # inside the assemble, so that the check list on a pull request names "test"
  # and a reader can see that the suite passed instead of inferring it from a
  # job titled after a build.
  #
  # It is also the cheap half of the pair: `testDebugUnitTest` ran in 28 seconds
  # here against a warm Gradle cache, against five to six minutes for the
  # assemble, and the two run side by side — so a failing test is reported
  # minutes before the compile it would otherwise have waited behind.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          # app/build.gradle.kts compiles against JavaVersion.VERSION_17 and
          # targets jvmTarget 17; this is read from the project, not chosen.
          distribution: temurin
          java-version: '17'
      # Caching is left entirely to this action. setup-java can cache ~/.gradle
      # too, and using both is explicitly discouraged because they manage the
      # same directory and fight over it — so the dependency and build caches
      # come from here, which is also what release.yml in this repo already
      # relies on successfully.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      # The failure a test report gives you and the console does not: which
      # assertion, with what values. Uploaded on failure only, because nobody
      # opens it when the job is green.
      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tv-unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Assemble debug
    if: ${{ !inputs.skip_assemble }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # `mergeDebugResources` is where a duplicate or badly named string
      # resource fails, and it fails for every locale at once. The unit tests
      # above do not compile the Android resources at all, so this is still the
      # only thing that catches a broken Gradle file, a missing native symbol
      # or a plugin that will not build.
      - name: Build
        run: ./gradlew :app:assembleDebug --no-daemon
