name: Release → Telegram
run-name: >-
  Release ${{ inputs.version != '' && inputs.version || inputs.bump }}

# One release for every TV app, under one version: a signed Android TV APK, an
# unsigned Apple TV IPA (macOS runner) and an LG webOS IPK. It records them in
# git, attaches all three to one GitHub Release, puts the APK on the CDN,
# optionally offers it to the in-app updater, and sends everything to Telegram.
# Runs only from Actions → this workflow → Run workflow, on the default branch.
#
# Order: version + guard → tests → APK, IPA, IPK → bump commit, tag, GitHub
# Release → CDN + updater → Telegram. Nothing is pushed or published until
# every requested build succeeded.
#
# Apple TV: there is no Apple distribution certificate here, so the IPA is not
# signed and people sideload it (Sideloadly, Xcode), which signs it with their
# own Apple ID. TestFlight stays in tvos-release.yml, for when the apple-tv
# environment has its secrets.
#
# Secrets:
#   ANDROID_TV_KEYSTORE_B64   base64 of the release keystore (.jks)
#   ANDROID_TV_KEY_PROPERTIES key.properties: storeFile, storePassword, keyAlias, keyPassword
#   SOZO_RELEASE_TOKEN        backend release token (X-Release-Token); without it the
#                             CDN upload and updater are skipped with a warning
#   TELEGRAM_BOT_TOKEN        bot token from @BotFather
#   TELEGRAM_CHAT_IDS         comma-separated numeric chat ids
# Optional variable: SOZO_API_BASE_URL overrides the API address baked into the app.
#
# Cloudflare answers GitHub's runners with a challenge page, so the API calls
# below (version guard, CDN, updater) often cannot get through. None of them
# fails the release for that: the backend takes the published GitHub Release
# itself (sozo-backend src/services/appReleaseSync.service.js), using the
# sozo-tv-<version>-release.json attached to it.
#
# The release page is release/notes/v<version>.md when somebody wrote one, or
# a page built from what was merged since the last tag, with the banner from
# tools/release/release_banner.py on top (committed with the bump under
# release/banners/). Telegram gets the banner, a caption and the APK.
#
# The signing key was replaced on 22 Aug 2026 because the original was lost, and
# the version line restarted at 1.0.0 with it. Builds signed by any other key are
# refused — see EXPECTED_CERT_SHA256 below.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise'
        type: choice
        default: patch
        options:
          - patch          # 10.0.0 -> 10.0.1
          - minor          # 10.0.0 -> 10.1.0
          - major          # 10.0.0 -> 11.0.0
          - code-only      # name unchanged, versionCode +1
          - none           # build and ship whatever is committed
      version:
        description: 'Exact versionName, e.g. 11.0.0 (overrides the choice above)'
        type: string
        required: false
      notes:
        description: 'Release notes (Telegram, CDN, updater, GitHub Release)'
        type: string
        required: false
      updater:
        description: 'Offer this build to the in-app updater'
        type: choice
        default: skip
        options: [skip, publish]
      github_release:
        description: 'GitHub Release for the tag'
        type: choice
        default: draft
        options: [draft, publish, skip]
      skip_version_guard:
        description: 'Proceed if the published version cannot be read (a readable one is always enforced)'
        type: boolean
        default: false
      apple_tv:
        description: 'Also build the Apple TV IPA (unsigned, for sideloading)'
        type: boolean
        default: true
      webos:
        description: 'Also build the LG webOS IPK'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APK_CONTENT_TYPE: application/vnd.android.package-archive

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      code: ${{ steps.resolve.outputs.code }}
      tag: ${{ steps.resolve.outputs.tag }}
      bumped: ${{ steps.resolve.outputs.bumped }}
      platforms: ${{ steps.resolve.outputs.platforms }}
    steps:
      - name: Refuse anything but the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error title=Wrong branch::Releases run only from ${DEFAULT_BRANCH}; this run was started from ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
          APPLE_TV: ${{ inputs.apple_tv }}
          WEBOS: ${{ inputs.webos }}
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle.kts

          NAME="$(grep -E '^\s*versionName\s*=' "$GRADLE" | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          CODE="$(grep -E '^\s*versionCode\s*=' "$GRADLE" | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')"

          case "${CODE}" in
            ''|*[!0-9]*) echo "::error title=Malformed versionCode::read '${CODE}' from ${GRADLE}"; exit 1 ;;
          esac
          if [ -z "${NAME}" ]; then
            echo "::error title=Malformed versionName::could not read it from ${GRADLE}"; exit 1
          fi
          echo "::notice title=Current version::${NAME} (versionCode ${CODE})"

          IFS=. read -r MA MI PA <<< "${NAME}"
          MA="${MA:-0}"; MI="${MI:-0}"; PA="${PA:-0}"
          NEW_CODE="$((CODE + 1))"
          BUMPED=yes

          if [ -n "${EXPLICIT}" ]; then
            if ! [[ "${EXPLICIT}" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
              echo "::error title=Bad version::'${EXPLICIT}' must be numbers separated by dots, e.g. 11.0.0"; exit 1
            fi
            NEW_NAME="${EXPLICIT}"
          else
            case "${BUMP}" in
              patch)     NEW_NAME="${MA}.${MI}.$((PA + 1))" ;;
              minor)     NEW_NAME="${MA}.$((MI + 1)).0" ;;
              major)     NEW_NAME="$((MA + 1)).0.0" ;;
              code-only) NEW_NAME="${NAME}" ;;
              none)      NEW_NAME="${NAME}"; NEW_CODE="${CODE}"; BUMPED=no ;;
              *)         echo "::error title=Unknown bump::'${BUMP}'"; exit 1 ;;
            esac
          fi

          TAG="v${NEW_NAME}"
          # Same name, new versionCode (code-only, or none after a hand-edited
          # code): the plain name tag is taken, so the code goes into the tag.
          if [ "${NEW_NAME}" = "${NAME}" ] \
             && git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG="v${NEW_NAME}-${NEW_CODE}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=Tag exists::${TAG} is already published. Pick a different bump, or delete the tag first."
            exit 1
          fi

          if [ "${WEBOS}" = true ] && ! [[ "${NEW_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad version for webOS::webOS takes only x.y.z, not '${NEW_NAME}'. Pick another version or untick webos."
            exit 1
          fi
          PLATFORMS=androidtv
          if [ "${APPLE_TV}" = true ]; then PLATFORMS="${PLATFORMS},appletv"; fi
          if [ "${WEBOS}" = true ]; then PLATFORMS="${PLATFORMS},webos"; fi

          {
            echo "name=${NEW_NAME}"
            echo "code=${NEW_CODE}"
            echo "tag=${TAG}"
            echo "bumped=${BUMPED}"
            echo "platforms=${PLATFORMS}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release version"
            echo ""
            echo "| | versionName | versionCode |"
            echo "|---|---|---|"
            echo "| was | \`${NAME}\` | \`${CODE}\` |"
            echo "| now | \`${NEW_NAME}\` | \`${NEW_CODE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Releasing::${NEW_NAME} (versionCode ${NEW_CODE})"

      # Devices only install an update whose versionCode is higher than what
      # they run, so shipping one that is not higher than the published row
      # is a release nobody receives.
      - name: Check versionCode against the published one
        env:
          NEW_CODE: ${{ steps.resolve.outputs.code }}
          SKIP_GUARD: ${{ inputs.skip_version_guard }}
          SOZO_API_BASE_URL: ${{ vars.SOZO_API_BASE_URL }}
        run: |
          set -euo pipefail
          API="$(python3 tools/release/api_base.py)" || API=""
          if [ -z "${API}" ]; then
            if [ "${SKIP_GUARD}" = true ]; then
              echo "::warning title=Version guard skipped::Could not work out the API base; continuing because skip_version_guard is set."
              exit 0
            fi
            echo "::error title=Version guard::Could not work out the API base from app/build.gradle.kts or vars.SOZO_API_BASE_URL."
            exit 1
          fi
          echo "::add-mask::${API}"

          HTTP="$(curl -sS --max-time 20 --retry 3 --retry-all-errors \
                    -A 'sozo-tv-release' -o version.json -w '%{http_code}' \
                    "${API}/app-version?platform=androidtv")" || HTTP=000
          if [ "${HTTP}" = 403 ] && grep -qiE 'just a moment|cf-chl|challenge-platform' version.json 2>/dev/null; then
            echo "::warning title=Version guard skipped::Cloudflare challenged this runner. The backend never moves the updater to a lower versionCode, so a stale build is refused there."
            exit 0
          fi
          PUBLISHED=""
          if [ "${HTTP}" = 200 ]; then
            PUBLISHED="$(jq -er '.version // 0' version.json 2>/dev/null)" || PUBLISHED=""
          fi
          case "${PUBLISHED}" in
            ''|*[!0-9]*)
              if [ "${SKIP_GUARD}" = true ]; then
                echo "::warning title=Version guard skipped::Could not read the published Android TV version (HTTP ${HTTP}); continuing because skip_version_guard is set."
                exit 0
              fi
              echo "::error title=Version guard::Could not read the published Android TV version (GET /api/app-version?platform=androidtv, HTTP ${HTTP}). Re-run with skip_version_guard only if you know versionCode ${NEW_CODE} is higher than the published one."
              exit 1
              ;;
          esac

          if [ "${NEW_CODE}" -le "${PUBLISHED}" ]; then
            echo "::error title=versionCode not higher::This build would be versionCode ${NEW_CODE}, but ${PUBLISHED} is already published. Devices would never be offered it. Commit a higher versionCode in app/build.gradle.kts first."
            exit 1
          fi
          echo "::notice title=Version guard::versionCode ${NEW_CODE} > published ${PUBLISHED}"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      skip_assemble: true

  apk:
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The bump is committed only after this build succeeds, so the checkout
      # still carries the old version; the git job applies the same stamp.
      - name: Stamp the resolved version into the build
        env:
          NAME: ${{ needs.version.outputs.name }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          python3 tools/release/stamp_version.py "${NAME}" "${CODE}"
          grep -E '^\s*version(Code|Name)\s*=' app/build.gradle.kts

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TV_KEYSTORE_B64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_TV_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64}" ] || [ -z "${KEY_PROPERTIES}" ]; then
            echo "::error title=Signing secrets missing::ANDROID_TV_KEYSTORE_B64 / ANDROID_TV_KEY_PROPERTIES are not set. Refusing to ship an unsigned APK."
            exit 1
          fi
          printf '%s' "${KEYSTORE_B64}" | base64 -d > sozo-tv-release.jks
          printf '%s' "${KEY_PROPERTIES}" > key.properties
          echo "keystore restored ($(stat -c%s sozo-tv-release.jks) bytes)"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify the APK is signed by the expected certificate
        env:
          EXPECTED_CERT_SHA256: c952cee4c758db729767b5499cfd63cca17a51a319142e4d30fcb4e3237ca07f
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort | tail -1)"
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          CERTS="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERTS"

          ACTUAL="$(echo "$CERTS" | grep -oE 'certificate SHA-256 digest: [0-9a-f]+' | head -1 | awk '{print $NF}')"
          if [ -z "${ACTUAL}" ]; then
            echo "::error title=Unsigned APK::apksigner reported no certificate."
            exit 1
          fi
          if [ "${ACTUAL}" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "::error title=Wrong signing key::APK is signed by ${ACTUAL}, expected ${EXPECTED_CERT_SHA256}. Existing installs could not update to this build. Check ANDROID_TV_KEYSTORE_B64."
            exit 1
          fi
          echo "::notice title=Signature::matches the certificate already on devices"

      - name: Check the version inside the APK
        env:
          EXPECTED_CODE: ${{ needs.version.outputs.code }}
          EXPECTED_NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          AAPT="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort | tail -1)"
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          LINE="$("$AAPT" dump badging "$APK" | head -1)"
          CODE="$(echo "$LINE" | grep -oE "versionCode='[0-9]+'" | grep -oE '[0-9]+')"
          NAME="$(echo "$LINE" | grep -oE "versionName='[^']*'" | cut -d"'" -f2)"
          echo "APK: versionCode=${CODE} versionName=${NAME}"
          if [ "${CODE}" != "${EXPECTED_CODE}" ] || [ "${NAME}" != "${EXPECTED_NAME}" ]; then
            echo "::error title=Version mismatch::APK carries ${NAME} (${CODE}) but the release is ${EXPECTED_NAME} (${EXPECTED_CODE}). The gradle rewrite did not apply."
            exit 1
          fi
          {
            echo "### APK"
            echo ""
            echo "- versionName **${NAME}**, versionCode **${CODE}**"
            echo "- signature verified against the certificate already on devices"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK after its version and checksum it
        env:
          NAME: ${{ needs.version.outputs.name }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" \
             "dist/sozo-tv-${NAME}-${CODE}.apk"
          (cd dist && sha256sum ./*.apk | sed 's# \./# #' > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -lh dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sozo-tv-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error

  appletv:
    name: Apple TV IPA
    needs: version
    if: inputs.apple_tv
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Stamp the resolved version into the build
        env:
          NAME: ${{ needs.version.outputs.name }}
          CODE: ${{ needs.version.outputs.code }}
        run: python3 tools/release/stamp_version.py "${NAME}" "${CODE}"

      - name: Select Xcode
        run: apple-tv/scripts/select-xcode.sh 26

      - name: Install project generator
        run: brew install xcodegen

      # No signing identity exists on this runner, and none is wanted: the
      # sideloading tool signs the app with the installer's own Apple ID.
      - name: Archive for Apple TV, unsigned
        working-directory: apple-tv
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild archive -project SozoTV.xcodeproj -scheme SozoTV -configuration Release \
            -destination 'generic/platform=tvOS' -archivePath build/release/SozoTV.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= -quiet

      - name: Package the IPA and check its version
        env:
          NAME: ${{ needs.version.outputs.name }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          APP=apple-tv/build/release/SozoTV.xcarchive/Products/Applications/SozoTV.app
          PLIST="${APP}/Info.plist"
          GOT_NAME="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "${PLIST}")"
          GOT_CODE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "${PLIST}")"
          if [ "${GOT_NAME}" != "${NAME}" ] || [ "${GOT_CODE}" != "${CODE}" ]; then
            echo "::error title=Version mismatch::IPA carries ${GOT_NAME} (${GOT_CODE}), the release is ${NAME} (${CODE})."
            exit 1
          fi
          lipo -info "${APP}/SozoTV"
          mkdir -p ipa/Payload dist
          cp -R "${APP}" ipa/Payload/
          (cd ipa && zip -qry "../dist/sozo-tv-${NAME}-appletv.ipa" Payload)
          ls -lh dist
          echo "- Apple TV IPA **${NAME} (${CODE})**, unsigned" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sozo-tv-appletv
          path: dist/*.ipa
          if-no-files-found: error

  webos:
    name: LG webOS IPK
    needs: version
    if: inputs.webos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Stamp the resolved version into the build
        env:
          NAME: ${{ needs.version.outputs.name }}
          CODE: ${{ needs.version.outputs.code }}
        run: python3 tools/release/stamp_version.py "${NAME}" "${CODE}"

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webos/package-lock.json

      - name: Test and package
        working-directory: webos
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run package

      - name: Name the IPK after the release
        env:
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          IPK="webos/dist/ipk/com.soplay.sozo.webos_${NAME}_all.ipk"
          if [ ! -f "${IPK}" ]; then
            echo "::error title=No IPK::expected ${IPK}; found: $(ls webos/dist/ipk)"
            exit 1
          fi
          mkdir -p dist
          cp "${IPK}" "dist/sozo-tv-${NAME}-webos.ipk"
          ls -lh dist
          echo "- LG webOS IPK **${NAME}**" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sozo-tv-webos
          path: dist/*.ipk
          if-no-files-found: error

  git:
    name: Commit, tag and GitHub Release
    needs: [version, apk, appletv, webos]
    # Apple TV and webOS may be switched off (skipped); a failed one stops it.
    if: >-
      ${{ !cancelled() && needs.apk.result == 'success'
          && needs.appletv.result != 'failure' && needs.webos.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      release: ${{ steps.release.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # GITHUB_TOKEN (contents: write above); master has no rule against it.
          # The RELEASE_PAT secret is refused by GitHub (403) since November.
          token: ${{ github.token }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sozo-tv-*
          path: dist
          merge-multiple: true

      - name: One checksum file for every app
        run: |
          set -euo pipefail
          shopt -s nullglob
          (cd dist && sha256sum -- *.apk *.ipa *.ipk > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -lh dist

      - name: Commit the bump and push the tag
        id: tag
        env:
          NAME: ${{ needs.version.outputs.name }}
          CODE: ${{ needs.version.outputs.code }}
          TAG: ${{ needs.version.outputs.tag }}
          BUMPED: ${{ needs.version.outputs.bumped }}
          PLATFORMS: ${{ needs.version.outputs.platforms }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # A re-run of this job after the tag already landed reuses it.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch -q origin "refs/tags/${TAG}:refs/tags/${TAG}"
            echo "sha=$(git rev-parse "${TAG}^{commit}")" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tag already pushed::${TAG} exists; reusing it."
            exit 0
          fi

          git config user.name  "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          if [ "${BUMPED}" = yes ]; then
            python3 tools/release/stamp_version.py "${NAME}" "${CODE}"
            # The banner goes in with the bump, so the release page can show it
            # from this exact commit. One already there is kept.
            BANNER="release/banners/v${NAME}.svg"
            PREV="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
            git log ${PREV:+"${PREV}..HEAD"} --first-parent --format=%s > "${RUNNER_TEMP}/changes.txt"
            python3 tools/release/release_banner.py --version "${NAME}" --out "${BANNER}" \
              --log "${RUNNER_TEMP}/changes.txt" --platforms "${PLATFORMS}" --keep \
              || echo "::warning title=No banner::the release page will have none"
            [ -f "${BANNER}" ] && git add "${BANNER}"
            git add app/build.gradle.kts apple-tv/project.yml webos/appinfo.json webos/js/app.js
            git commit -m "chore: ${NAME} (${CODE})"
          fi
          git tag "${TAG}"
          SHA="$(git rev-parse HEAD)"

          # The tag carries the exact tree that was built, so it is the record
          # that must land. The branch may have moved since the run started.
          git push origin "refs/tags/${TAG}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          if [ "${BUMPED}" = yes ]; then
            if git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"; then
              echo "::notice title=Version bump committed::${NAME} (${CODE}) on ${DEFAULT_BRANCH}"
            else
              echo "::warning title=Version bump not on ${DEFAULT_BRANCH}::The push was rejected (branch moved, or no RELEASE_PAT). ${TAG} records the build, but ${DEFAULT_BRANCH} still has the old versionCode; commit ${CODE} or higher before the next release, or the version guard will stop it."
            fi
          fi

      - name: GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODE: ${{ inputs.github_release }}
          NAME: ${{ needs.version.outputs.name }}
          CODE: ${{ needs.version.outputs.code }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
          NOTES: ${{ inputs.notes }}
          UPDATER: ${{ inputs.updater }}
          PLATFORMS: ${{ needs.version.outputs.platforms }}
        run: |
          set -euo pipefail
          if [ "${MODE}" = skip ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # What the backend reads when it takes this release from GitHub: the
          # versionCode no file name states plainly, the APK, and whether to
          # offer it to installed TVs. Only the APK: the backend has no Apple
          # TV or webOS download rows, and would file anything listed here
          # under Android TV.
          APK_NAME="$(basename "$(find dist -name '*.apk' | head -1)")"
          jq -n --arg version "${NAME}" --argjson build "${CODE}" --arg sha "${SHA}" \
                --arg notes "${NOTES}" --arg apk "${APK_NAME}" --arg updater "${UPDATER}" \
            '{version: $version, build: $build, sha: $sha, notes: $notes,
              updater: ($updater == "publish"), files: [{name: $apk, arch: "universal"}]}' \
            > "dist/sozo-tv-${NAME}-release.json"

          FILES=(dist/*.apk dist/SHA256SUMS "dist/sozo-tv-${NAME}-release.json")
          for f in dist/*.ipa dist/*.ipk; do [ -f "${f}" ] && FILES+=("${f}"); done
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FILES[@]}" --clobber
          else
            PREV="$(git describe --tags --abbrev=0 "${SHA}^" 2>/dev/null || true)"
            git log ${PREV:+"${PREV}..${SHA}"} --first-parent --format=%s > changes.txt
            python3 tools/release/release_page.py --version "${NAME}" --sha "${SHA}" \
              --repo "${GH_REPO}" --tag "${TAG}" --assets dist --previous "${PREV}" \
              --log changes.txt --intro "${NOTES}" --platforms "${PLATFORMS}" --auto --out RELEASE_NOTES.md
            echo "── notes ──"; cat RELEASE_NOTES.md
            ARGS=(--target "${SHA}" --title "Sozo TV ${NAME}" --notes-file RELEASE_NOTES.md)
            if [ "${MODE}" = draft ]; then
              ARGS+=(--draft)
            fi
            gh release create "${TAG}" "${FILES[@]}" "${ARGS[@]}"
          fi
          if [ "${MODE}" = draft ]; then
            echo "status=draft" >> "$GITHUB_OUTPUT"
          else
            echo "status=published" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: CDN and in-app updater
    needs: [version, apk, git]
    if: ${{ !cancelled() && needs.git.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cdn: ${{ steps.cdn.outputs.status }}
      cdn_url: ${{ steps.cdn.outputs.url }}
      updater: ${{ steps.updater.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/release
            app/build.gradle.kts
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sozo-tv-apk
          path: dist

      # replacePrevious updates the TV's download row in place, so its download
      # count carries on and a re-run does not add a second row.
      - name: Upload to the CDN
        id: cdn
        env:
          SOZO_RELEASE_TOKEN: ${{ secrets.SOZO_RELEASE_TOKEN }}
          SOZO_API_BASE_URL: ${{ vars.SOZO_API_BASE_URL }}
          NAME: ${{ needs.version.outputs.name }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [ -z "${SOZO_RELEASE_TOKEN}" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "::warning title=CDN skipped::SOZO_RELEASE_TOKEN is not set, so the APK was not uploaded to the CDN and the updater was not touched."
            exit 0
          fi
          API="$(python3 tools/release/api_base.py)"
          echo "::add-mask::${API}"

          # Cloudflare answers GitHub's runners with a challenge page. The
          # backend takes the published GitHub Release itself, so step aside.
          challenged() {
            [ "$1" = 403 ] && grep -qiE 'just a moment|cf-chl|challenge-platform' "$2" 2>/dev/null
          }
          defer() {
            echo "status=deferred" >> "$GITHUB_OUTPUT"
            echo "::warning title=CDN deferred to the backend::Cloudflare challenged ${1}. The backend uploads the APK (and updates the updater when asked) within 10 minutes of the GitHub Release being published."
            exit 0
          }

          APK="$(find dist -name '*.apk' | head -1)"
          SIZE="$(stat -c%s "${APK}")"

          jq -n --arg filename "$(basename "${APK}")" --arg ct "${APK_CONTENT_TYPE}" \
                --arg version "${NAME}" --argjson size "${SIZE}" \
                '{platform: "androidtv", filename: $filename, contentType: $ct,
                  size: $size, version: $version, arch: "universal"}' > presign-req.json
          HTTP="$(curl -sS --max-time 30 -X POST "${API}/admin/downloads/upload-url" \
                    -H "X-Release-Token: ${SOZO_RELEASE_TOKEN}" -H 'Content-Type: application/json' \
                    --data @presign-req.json -o presign.json -w '%{http_code}')" || HTTP=000
          if challenged "${HTTP}" presign.json; then defer "POST /admin/downloads/upload-url"; fi
          if [ "${HTTP}" != 200 ]; then
            echo "::error title=CDN upload URL::POST /admin/downloads/upload-url returned HTTP ${HTTP}: $(head -c 300 presign.json 2>/dev/null)"
            exit 1
          fi
          UPLOAD_URL="$(jq -er .uploadUrl presign.json)"
          echo "::add-mask::${UPLOAD_URL}"
          KEY="$(jq -er .key presign.json)"
          PUBLIC_URL="$(jq -er .publicUrl presign.json)"

          # Content-Type is part of the signature: it must match what was presigned.
          HTTP="$(curl -sS --max-time 900 --upload-file "${APK}" \
                    -H "Content-Type: ${APK_CONTENT_TYPE}" \
                    -o put.txt -w '%{http_code}' "${UPLOAD_URL}")" || HTTP=000
          if [ "${HTTP}" != 200 ]; then
            echo "::error title=CDN upload::PUT to R2 returned HTTP ${HTTP}: $(head -c 300 put.txt 2>/dev/null)"
            exit 1
          fi

          jq -n --arg version "${NAME}" --arg url "${PUBLIC_URL}" --arg key "${KEY}" \
                --argjson size "${SIZE}" --arg notes "${NOTES}" \
                '{platform: "androidtv", version: $version, arch: "universal", format: "apk",
                  fileUrl: $url, fileKey: $key, fileSize: $size, releaseNotes: $notes,
                  active: true, replacePrevious: true}' > download-req.json
          HTTP="$(curl -sS --max-time 30 -X POST "${API}/admin/downloads" \
                    -H "X-Release-Token: ${SOZO_RELEASE_TOKEN}" -H 'Content-Type: application/json' \
                    --data @download-req.json -o download.json -w '%{http_code}')" || HTTP=000
          if challenged "${HTTP}" download.json; then defer "POST /admin/downloads"; fi
          if [ "${HTTP}" != 201 ]; then
            echo "::error title=Download row::POST /admin/downloads returned HTTP ${HTTP}: $(head -c 300 download.json 2>/dev/null). The file is on the CDN at ${PUBLIC_URL} but not listed."
            exit 1
          fi

          {
            echo "status=uploaded"
            echo "url=${PUBLIC_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "### CDN" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${PUBLIC_URL}" >> "$GITHUB_STEP_SUMMARY"

      # The PUT replaces the whole row, so the current row is read first and
      # only version, downloadUrl and releaseNotes change.
      - name: Publish to the in-app updater
        id: updater
        env:
          MODE: ${{ inputs.updater }}
          CDN: ${{ steps.cdn.outputs.status }}
          URL: ${{ steps.cdn.outputs.url }}
          CODE: ${{ needs.version.outputs.code }}
          NOTES: ${{ inputs.notes }}
          SOZO_RELEASE_TOKEN: ${{ secrets.SOZO_RELEASE_TOKEN }}
          SOZO_API_BASE_URL: ${{ vars.SOZO_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ "${MODE}" != publish ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${CDN}" = deferred ]; then
            echo "status=deferred" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${CDN}" != uploaded ]; then
            echo "status=skipped (no CDN upload)" >> "$GITHUB_OUTPUT"
            echo "::warning title=Updater skipped::updater=publish needs the CDN upload, which did not happen (SOZO_RELEASE_TOKEN missing)."
            exit 0
          fi
          API="$(python3 tools/release/api_base.py)"
          echo "::add-mask::${API}"

          HTTP="$(curl -sS --max-time 30 "${API}/admin/app-versions/androidtv" \
                    -H "X-Release-Token: ${SOZO_RELEASE_TOKEN}" \
                    -o current.json -w '%{http_code}')" || HTTP=000
          if [ "${HTTP}" = 403 ] && grep -qiE 'just a moment|cf-chl|challenge-platform' current.json; then
            echo "status=deferred" >> "$GITHUB_OUTPUT"
            echo "::warning title=Updater deferred to the backend::Cloudflare challenged the runner; the backend offers this build once the GitHub Release is published."
            exit 0
          fi
          case "${HTTP}" in
            200) ;;
            404) echo '{"minVersion": 1, "forceUpdate": false, "active": true}' > current.json ;;
            *)
              echo "::error title=Updater read::GET /admin/app-versions/androidtv returned HTTP ${HTTP}: $(head -c 300 current.json 2>/dev/null)"
              exit 1
              ;;
          esac

          jq --argjson code "${CODE}" --arg url "${URL}" --arg notes "${NOTES}" \
             '{version: $code,
               minVersion: (.minVersion // 1),
               downloadUrl: $url,
               storeUrl: null,   # the backend refuses a storeUrl from the release token
               releaseNotes: $notes,
               forceUpdate: (.forceUpdate // false),
               active: (.active != false)}' current.json > updater-req.json
          if [ "$(jq -r .active updater-req.json)" != true ]; then
            echo "::warning title=Updater row inactive::The androidtv row is switched off in the admin panel and stays off; devices will not be offered ${CODE} until it is switched on."
          fi

          HTTP="$(curl -sS --max-time 30 -X PUT "${API}/admin/app-versions/androidtv" \
                    -H "X-Release-Token: ${SOZO_RELEASE_TOKEN}" -H 'Content-Type: application/json' \
                    --data @updater-req.json -o updated.json -w '%{http_code}')" || HTTP=000
          if [ "${HTTP}" = 403 ] && grep -qiE 'just a moment|cf-chl|challenge-platform' updated.json; then
            echo "status=deferred" >> "$GITHUB_OUTPUT"
            echo "::warning title=Updater deferred to the backend::Cloudflare challenged the runner; the backend offers this build once the GitHub Release is published."
            exit 0
          fi
          if [ "${HTTP}" != 200 ]; then
            echo "::error title=Updater write::PUT /admin/app-versions/androidtv returned HTTP ${HTTP}: $(head -c 300 updated.json 2>/dev/null)"
            exit 1
          fi
          echo "status=published" >> "$GITHUB_OUTPUT"
          echo "::notice title=Updater::androidtv now offers versionCode ${CODE}"

  deliver:
    needs: [version, apk, appletv, webos, git, publish]
    # Always, even when something failed: a release that goes quiet is
    # indistinguishable from one nobody started.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.git.outputs.sha || github.sha }}

      # Not fatal: when the build failed there is no artifact, and the message
      # saying so is what this job is for.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: sozo-tv-*
          path: dist
          merge-multiple: true

      # The banner as a picture (Telegram cannot show SVG) and the caption.
      # Neither is fatal: without them the announcement goes out as text.
      - name: Banner and caption for Telegram
        continue-on-error: true
        env:
          NAME: ${{ needs.version.outputs.name }}
          NOTES: ${{ inputs.notes }}
          PLATFORMS: ${{ needs.version.outputs.platforms }}
        run: |
          set -uo pipefail
          [ -n "${NAME}" ] || exit 0
          PREV="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          git log ${PREV:+"${PREV}..HEAD"} --first-parent --format=%s > changes.txt
          python3 tools/release/release_page.py --version "${NAME}" --log changes.txt \
            --intro "${NOTES}" --platforms "${PLATFORMS}" --telegram caption.html
          python3 tools/release/release_banner.py --version "${NAME}" --still --log changes.txt \
            --platforms "${PLATFORMS}" --out banner.svg
          timeout 120 sudo apt-get install -y -qq fonts-inter >/dev/null 2>&1 || true
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "${CHROME}" ]; then
            "${CHROME}" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --window-size=1280,640 --force-device-scale-factor=2 \
              --screenshot="${PWD}/banner.png" "file://${PWD}/banner.svg" >/dev/null 2>&1 || true
          fi
          if [ ! -s banner.png ]; then
            timeout 120 sudo apt-get install -y -qq librsvg2-bin >/dev/null 2>&1 \
              && rsvg-convert -w 2560 -h 1280 banner.svg -o banner.png || true
          fi
          ls -l banner.png caption.html || true
          echo "── caption ──"; cat caption.html || true

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.notes }}
          UPDATER_MODE: ${{ inputs.updater }}
          GIT_RESULT: ${{ needs.git.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CDN_STATUS: ${{ needs.publish.outputs.cdn }}
          CDN_URL: ${{ needs.publish.outputs.cdn_url }}
          UPDATER_STATUS: ${{ needs.publish.outputs.updater }}
          RELEASE_STATUS: ${{ needs.git.outputs.release }}
          APPLE_TV_RESULT: ${{ needs.appletv.result }}
          WEBOS_RESULT: ${{ needs.webos.result }}
        run: |
          set -uo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_IDS}" ]; then
            echo "::warning title=Telegram skipped::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_IDS not set. The APK is attached to this run as an artifact."
            exit 0
          fi

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"
          MAX=$((49 * 1024 * 1024))   # Bot API sendDocument limit is 50 MB
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REL_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          IFS=',' read -ra CHATS <<< "${TELEGRAM_CHAT_IDS}"

          if ! ls dist/*.apk >/dev/null 2>&1; then
            MSG="$(printf '⚠️ Sozo TV %s — release YIQILDI, APK chiqmadi.\n\n🔎 %s' \
                   "${VERSION_NAME:-?}" "${RUN_URL}")"
            for raw in "${CHATS[@]}"; do
              chat="$(echo "${raw}" | xargs)"
              [ -z "${chat}" ] && continue
              curl -sS -X POST "${API}/sendMessage" \
                --data-urlencode "chat_id=${chat}" \
                --data-urlencode "text=${MSG}" \
                --data "disable_web_page_preview=true" -o /dev/null || true
            done
            echo "::warning title=Nothing to deliver::The build produced no APK; a failure notice was sent instead."
            exit 0
          fi

          if [ "${APPLE_TV_RESULT}" = failure ] || [ "${WEBOS_RESULT}" = failure ]; then
            MSG="$(printf '⚠️ Sozo TV %s — release YIQILDI (Apple TV: %s, webOS: %s). Hech narsa chiqarilmadi.\n\n🔎 %s' \
                   "${VERSION_NAME:-?}" "${APPLE_TV_RESULT}" "${WEBOS_RESULT}" "${RUN_URL}")"
            for raw in "${CHATS[@]}"; do
              chat="$(echo "${raw}" | xargs)"
              [ -z "${chat}" ] && continue
              curl -sS -X POST "${API}/sendMessage" \
                --data-urlencode "chat_id=${chat}" \
                --data-urlencode "text=${MSG}" \
                --data "disable_web_page_preview=true" -o /dev/null || true
            done
            echo "::warning title=Nothing delivered::A TV build failed, so nothing was released; a failure notice was sent instead."
            exit 0
          fi

          # 1. The announcement: banner, caption, buttons. A draft's page is
          #    not public, so only a published release gets its button.
          BUTTONS="$(jq -cn --arg cdn "${CDN_URL}" --arg rel "${REL_URL}" \
            --arg cdnok "${CDN_STATUS}" --arg rs "${RELEASE_STATUS}" '
            [ (if $cdnok == "uploaded" and $cdn != "" then [{text: "⬇️ APK yuklab olish", url: $cdn}] else empty end),
              (if $rs == "published" then [{text: "📦 Release sahifasi", url: $rel}] else empty end),
              [{text: "📣 Kanal", url: "https://t.me/sozoapp"}, {text: "💬 Discord", url: "https://discord.gg/n22URhYvMR"}] ]
            | {inline_keyboard: .}')"
          PLAIN="$(printf '📺 Sozo TV %s (versionCode %s)' "${VERSION_NAME}" "${VERSION_CODE}")"
          if [ -n "${RELEASE_NOTES}" ]; then PLAIN="$(printf '%s\n\n📝 %s' "${PLAIN}" "${RELEASE_NOTES}")"; fi

          # 2. Under the APK: how it gets to TVs, and what happened.
          FOOT="$(printf '📺 <b>Sozo TV %s</b> · versionCode %s' "${VERSION_NAME}" "${VERSION_CODE}")"
          if [ "${PUBLISH_RESULT}" != success ]; then
            FOOT="${FOOT}$(printf '\n❌ CDN/updater yiqildi: %s' "${RUN_URL}")"
          else
            case "${CDN_STATUS}:${UPDATER_STATUS}" in
              deferred:*|uploaded:deferred)
                if [ "${UPDATER_MODE}" = publish ]; then
                  FOOT="${FOOT}$(printf '\n🔄 Yuklab olish sahifasi va TV ichidagi yangilanish: release Publish qilingach server o‘zi yangilaydi (10 daqiqa ichida).')"
                else
                  FOOT="${FOOT}$(printf '\n🔄 Yuklab olish sahifasi: release Publish qilingach server o‘zi yangilaydi. TV ichidagi yangilanish taklif qilinmaydi.')"
                fi ;;
              uploaded:published) FOOT="${FOOT}$(printf '\n🔄 Yuklab olish sahifasi va TV ichidagi yangilanish yangilandi.')" ;;
              uploaded:*)         FOOT="${FOOT}$(printf '\n⬇️ Yuklab olish sahifasi yangilandi; TV ichidagi yangilanish taklif qilinmadi.')" ;;
              skipped:*)          FOOT="${FOOT}$(printf '\n⚠️ CDN o‘tkazib yuborildi (SOZO_RELEASE_TOKEN yo‘q).')" ;;
            esac
          fi
          if [ "${GIT_RESULT}" != success ]; then
            FOOT="${FOOT}$(printf '\n⚠️ Teg/GitHub Release bajarilmadi: %s' "${RUN_URL}")"
          elif [ "${RELEASE_STATUS}" = draft ]; then
            FOOT="${FOOT}$(printf '\n🏷 GitHub Release: draft — Publish qilinmaguncha server uni ko‘rmaydi.')"
          fi
          FOOT="${FOOT}$(printf '\n\n💡 O‘rnatish: TV’da <b>Downloader</b> ilovasi orqali APK havolasini oching yoki USB orqali.')"

          # Under the other two files: what they are and how they get onto a TV.
          caption_for() {
            case "$1" in
              *.apk) printf '%s' "${FOOT}" ;;
              *.ipa) printf '🍎 <b>Sozo TV %s · Apple TV</b> (tvOS 17+)\n\nImzosiz IPA: <b>Sideloadly</b> yoki Xcode orqali o‘z Apple ID’ingiz bilan o‘rnating. Bepul Apple ID’da 7 kunda qayta o‘rnatish kerak bo‘ladi.\n📖 Yo‘riqnoma: %s' "${VERSION_NAME}" "${REL_URL}" ;;
              *.ipk) printf '🟣 <b>Sozo TV %s · LG webOS</b> (webOS 4+)\n\nTV’da <b>Developer Mode</b> ilovasini yoqing, so‘ng kompyuterdan <code>ares-install</code> bilan o‘rnating.\n📖 Yo‘riqnoma: %s' "${VERSION_NAME}" "${REL_URL}" ;;
            esac
          }

          announce() {
            local chat="$1"
            if [ -s banner.png ] && [ -s caption.html ]; then
              curl -sS --fail-with-body -X POST "${API}/sendPhoto" \
                -F "chat_id=${chat}" -F "photo=@banner.png" -F "caption=<caption.html" \
                -F "parse_mode=HTML" -F "reply_markup=${BUTTONS}" -o /tmp/tg_msg.json && return 0
              echo "::warning::sendPhoto ${chat}: $(cat /tmp/tg_msg.json) — sending text instead"
            fi
            local text="${PLAIN}"
            local mode=()
            if [ -s caption.html ]; then text="$(cat caption.html)"; mode=(--data "parse_mode=HTML"); fi
            curl -sS --fail-with-body -X POST "${API}/sendMessage" \
              --data-urlencode "chat_id=${chat}" --data-urlencode "text=${text}" \
              --data-urlencode "reply_markup=${BUTTONS}" ${mode[@]+"${mode[@]}"} \
              --data "disable_web_page_preview=true" -o /tmp/tg_msg.json && return 0
            curl -sS --fail-with-body -X POST "${API}/sendMessage" \
              --data-urlencode "chat_id=${chat}" --data-urlencode "text=${PLAIN}"$'\n\n'"${RUN_URL}" \
              -o /tmp/tg_msg.json
          }

          send_apk() {
            local chat="$1" f size cap
            for f in dist/*.apk dist/*.ipa dist/*.ipk; do
              [ -f "${f}" ] || continue
              size="$(stat -c%s "${f}")"
              cap="$(caption_for "${f}")"
              if [ "${size}" -gt "${MAX}" ]; then
                curl -sS --fail-with-body -X POST "${API}/sendMessage" --data-urlencode "chat_id=${chat}" \
                  --data-urlencode "text=${cap}"$'\n\n'"⬇️ $(basename "${f}") ($((size/1024/1024)) MB) Telegram limitidan katta: ${REL_URL}" \
                  --data "parse_mode=HTML" -o /tmp/tg_doc.json || return 1
                continue
              fi
              curl -sS --fail-with-body -X POST "${API}/sendDocument" -F "chat_id=${chat}" \
                -F "document=@${f}" -F "caption=${cap}" -F "parse_mode=HTML" -o /tmp/tg_doc.json || return 1
              echo "    ✓ $(basename "${f}")"
            done
          }

          fail=0
          for raw in "${CHATS[@]}"; do
            chat="$(echo "${raw}" | xargs)"
            [ -z "${chat}" ] && continue
            echo "──▶ ${chat}"
            announce "${chat}" || { echo "::error::announcement ${chat}: $(cat /tmp/tg_msg.json)"; fail=1; }
            send_apk "${chat}" || { echo "::error::APK ${chat}: $(cat /tmp/tg_doc.json)"; fail=1; }
          done
          exit "${fail}"
