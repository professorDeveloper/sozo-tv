name: Apple TV CI

# `push` is the default branch only. It had no branch filter, and with
# `pull_request` alongside it every push to a branch with a pull request open
# ran this whole thing TWICE. On 2 Nov that was runs 41400668675 (push) and
# 41400672636 (pull_request) on the same commit, 21 and 18 minutes — and this
# job is on `macos-26`, which GitHub bills at TEN TIMES the Linux rate. So one
# push to this branch cost about 390 billed minutes where 210 would have done,
# and did it by booting a tvOS simulator and running the identical suite twice.
#
# The pair still covers everything between them: a branch with a pull request
# is covered by `pull_request`, a push straight to the default branch by
# `push`. A branch with no pull request yet now gets no Apple TV CI, which is
# the state where nobody is waiting on a verdict — and `workflow_dispatch`
# below is there for when somebody is.
on:
  push:
    branches: [master]
    paths: ['apple-tv/**', '.github/workflows/tvos-*.yml']
  pull_request:
    paths: ['apple-tv/**', '.github/workflows/tvos-*.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: tvos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: tvOS Foundation, remote UI and signed Release
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build and fixture tools
        run: brew install xcodegen ffmpeg actionlint shellcheck
      - name: Validate workflow and shell scripts
        run: |
          actionlint .github/workflows/tvos-ci.yml .github/workflows/tvos-release.yml
          shellcheck apple-tv/scripts/*.sh
      - name: Run the same checks as local development
        run: apple-tv/scripts/ci.sh
      - name: Save logs, screenshots, results and simulator app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apple-tv/build/ci/*.log
            apple-tv/build/ci/*.json
            apple-tv/build/ci/*.txt
            apple-tv/build/ci/*.zip
            apple-tv/build/ci/*.xcresult
          if-no-files-found: warn
          retention-days: 14
